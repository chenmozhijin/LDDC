name: Cross-Platform Validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0-0.2.pre

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - run: flutter pub get
      - name: Build Windows release
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build windows --release
      - name: Build Windows debug application for native automation
        id: debug_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build windows --debug
      - name: Run offline application flows
        id: offline
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile offline -Device windows -Platform windows
      - name: Run native channel flows
        id: native_channel
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile platform -Device windows -Platform windows
      - name: Run Windows file dialog automation
        id: system_ui
        if: always() && steps.debug_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_windows_platform_tests.ps1
      - name: Run real desktop process and service tests
        id: desktop_process
        if: always() && steps.debug_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_desktop_process_e2e.ps1 -Platform windows
      - name: Run production media resource checks
        id: media_resource
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_platform_media_resource.ps1 -Platform windows -LoopCount 3
      - name: Upload failed Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-failure
          path: lddc/build/integration_reports/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required Windows outcomes
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            '${{ steps.release_build.outcome }}',
            '${{ steps.debug_build.outcome }}',
            '${{ steps.offline.outcome }}',
            '${{ steps.native_channel.outcome }}',
            '${{ steps.system_ui.outcome }}',
            '${{ steps.desktop_process.outcome }}',
            '${{ steps.media_resource.outcome }}'
          )
          if ($outcomes | Where-Object { $_ -ne 'success' }) {
            throw "Windows required phase failed or was skipped: $($outcomes -join ', ')"
          }

  macos-validation:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - run: flutter pub get
      - name: Keep Apple dependency resolution on CocoaPods
        run: flutter config --no-enable-swift-package-manager
      - name: Build macOS release
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build macos --release
      - name: Build macOS debug application for native automation
        id: debug_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build macos --debug
      - name: Run offline application flows
        id: offline
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile offline -Device macos -Platform macos
      - name: Run native channel flows
        id: native_channel
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile platform -Device macos -Platform macos
      - name: Run macOS file panel automation
        id: system_ui
        if: always() && steps.debug_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_macos_platform_tests.ps1
      - name: Run real desktop process and service tests
        id: desktop_process
        if: always() && steps.debug_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_desktop_process_e2e.ps1 -Platform macos
      - name: Run production media resource checks
        id: media_resource
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_platform_media_resource.ps1 -Platform macos -LoopCount 3
      - name: Upload failed macOS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-validation-failure
          path: lddc/build/integration_reports/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required macOS outcomes
        if: always()
        run: |
          outcomes=(
            '${{ steps.release_build.outcome }}'
            '${{ steps.debug_build.outcome }}'
            '${{ steps.offline.outcome }}'
            '${{ steps.native_channel.outcome }}'
            '${{ steps.system_ui.outcome }}'
            '${{ steps.desktop_process.outcome }}'
            '${{ steps.media_resource.outcome }}'
          )
          for outcome in "${outcomes[@]}"; do
            [[ "$outcome" == success ]] || exit 1
          done

  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - name: Install Linux build and automation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev dbus-x11 \
            xvfb xauth at-spi2-core gir1.2-atspi-2.0 gir1.2-gtk-3.0 \
            python3-gi python3-pyatspi python3-pytest python3-venv ffmpeg
          python3 -m venv --system-site-packages .venv-linux-platform
          .venv-linux-platform/bin/python -m pip install \
            --no-deps --require-hashes -r tool/test/requirements-linux-platform.txt
      - run: flutter pub get
      - name: Build Linux release
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build linux --release
      - name: Build Linux debug application for native automation
        id: debug_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build linux --debug
      - name: Run offline application flows
        id: offline
        continue-on-error: true
        run: >-
          xvfb-run -a --server-args="-screen 0 1600x1000x24"
          pwsh -NoProfile -File tool/test/run_real_integration.ps1
          -Profile offline -Device linux -Platform linux
      - name: Run native channel flows
        id: native_channel
        continue-on-error: true
        run: >-
          xvfb-run -a --server-args="-screen 0 1600x1000x24"
          pwsh -NoProfile -File tool/test/run_real_integration.ps1
          -Profile platform -Device linux -Platform linux
      - name: Run Linux file dialog automation
        id: system_ui
        if: always() && steps.debug_build.outcome == 'success'
        continue-on-error: true
        run: >-
          dbus-run-session -- xvfb-run -a --server-args="-screen 0 1600x1000x24"
          env LDDC_PLATFORM_PYTHON="$PWD/.venv-linux-platform/bin/python"
          bash tool/test/run_linux_platform_tests.sh
      - name: Run real desktop process and service tests
        id: desktop_process
        if: always() && steps.debug_build.outcome == 'success'
        continue-on-error: true
        run: >-
          dbus-run-session -- xvfb-run -a --server-args="-screen 0 1600x1000x24"
          pwsh -NoProfile -File tool/test/run_desktop_process_e2e.ps1 -Platform linux
      - name: Run production media resource checks
        id: media_resource
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_platform_media_resource.ps1 -Platform linux -LoopCount 3
      - name: Upload failed Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-validation-failure
          path: lddc/build/integration_reports/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required Linux outcomes
        if: always()
        run: |
          outcomes=(
            '${{ steps.release_build.outcome }}'
            '${{ steps.debug_build.outcome }}'
            '${{ steps.offline.outcome }}'
            '${{ steps.native_channel.outcome }}'
            '${{ steps.system_ui.outcome }}'
            '${{ steps.desktop_process.outcome }}'
            '${{ steps.media_resource.outcome }}'
          )
          for outcome in "${outcomes[@]}"; do
            [[ "$outcome" == success ]] || exit 1
          done

  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LDDC_ALLOW_UNSIGNED_CI_RELEASE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - run: flutter pub get
      - name: Build unsigned Android release outputs
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Run Android application, channel, and DocumentsUI validation
        id: platform_validation
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p lddc/build/integration_reports
            phase_events='lddc/build/integration_reports/android-phases.jsonl'
            : > "$phase_events"
            run_phase() {
              local name="$1"
              local limit="$2"
              shift 2
              local started_at ended_at phase_exit
              started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "::group::Android phase $name (timeout=$limit)"
              set +e
              timeout --signal=TERM --kill-after=30s "$limit" "$@"
              phase_exit=$?
              set -e
              ended_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              jq -cn \
                --arg phase "$name" \
                --arg startedAt "$started_at" \
                --arg endedAt "$ended_at" \
                --argjson exitCode "$phase_exit" \
                '{phase: $phase, startedAt: $startedAt, endedAt: $endedAt, exitCode: $exitCode}' \
                >> "$phase_events"
              echo "Android phase $name exit=$phase_exit started=$started_at ended=$ended_at"
              echo '::endgroup::'
              return "$phase_exit"
            }
            status=0
            run_phase android-jvm 25m bash -lc \
              'cd lddc/android && chmod +x gradlew && ./gradlew :app:testDebugUnitTest' || status=1
            run_phase android-offline 35m pwsh -NoProfile -File \
              tool/test/run_real_integration.ps1 -Profile offline \
              -Device emulator-5554 -Platform android || status=1
            run_phase android-platform 35m pwsh -NoProfile -File \
              tool/test/run_real_integration.ps1 -Profile platform \
              -Device emulator-5554 -Platform android || status=1
            run_phase android-uiautomator 30m pwsh -NoProfile -File \
              tool/test/run_android_platform_tests.ps1 -Device emulator-5554 || status=1
            jq -s '.' "$phase_events" > lddc/build/integration_reports/android-phases.json
            exit $status
      - name: Upload failed Android diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-failure
          path: |
            lddc/build/integration_reports/**
            lddc/build/app/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required Android outcomes
        if: always()
        run: |
          [[ '${{ steps.release_build.outcome }}' == success ]]
          [[ '${{ steps.platform_validation.outcome }}' == success ]]

  ios-validation:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - run: flutter pub get
      - name: Keep Apple dependency resolution on CocoaPods
        run: flutter config --no-enable-swift-package-manager
      - name: Create and boot a compatible iOS simulator
        id: simulator
        continue-on-error: true
        run: bash tool/test/create_ios_simulator.sh
      - name: Build iOS release without codesigning
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build ios --release --no-codesign
      - name: Run offline application flows
        id: offline
        if: always() && steps.simulator.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile offline -Device $env:DEVICE_ID -Platform ios
      - name: Run native channel flows
        id: native_channel
        if: always() && steps.simulator.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile platform -Device $env:DEVICE_ID -Platform ios
      - name: Run iOS native unit tests
        id: native_tests
        if: always() && steps.simulator.outcome == 'success'
        continue-on-error: true
        working-directory: lddc
        run: >-
          xcodebuild test
          -workspace ios/Runner.xcworkspace
          -scheme Runner
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          CODE_SIGNING_ALLOWED=NO
      - name: Run iOS Document Picker automation
        id: system_ui
        if: always() && steps.simulator.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_ios_platform_tests.ps1 -Device $env:DEVICE_ID
      - name: Delete the CI iOS simulator
        if: always() && env.DEVICE_ID != ''
        run: |
          xcrun simctl shutdown "$DEVICE_ID" || true
          xcrun simctl delete "$DEVICE_ID" || true
      - name: Upload failed iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-validation-failure
          path: lddc/build/integration_reports/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required iOS outcomes
        if: always()
        run: |
          outcomes=(
            '${{ steps.simulator.outcome }}'
            '${{ steps.release_build.outcome }}'
            '${{ steps.offline.outcome }}'
            '${{ steps.native_channel.outcome }}'
            '${{ steps.native_tests.outcome }}'
            '${{ steps.system_ui.outcome }}'
          )
          for outcome in "${outcomes[@]}"; do
            [[ "$outcome" == success ]] || exit 1
          done

  experimental-web:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - run: flutter pub get
      - name: Build experimental Web client
        working-directory: lddc
        run: flutter build web --release
      - name: Run browser capability observation
        working-directory: lddc
        run: |
          mkdir -p build/web-observation
          flutter test integration_test/web_capability_observation_test.dart -d chrome \
            --file-reporter=json:build/web-observation/tests.jsonl
          python ../tool/test/json_report_to_junit.py \
            --input build/web-observation/tests.jsonl \
            --output build/web-observation/tests.xml
      - name: Upload Web observation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experimental-web-observation
          path: lddc/build/web-observation/**
          if-no-files-found: warn
          retention-days: 7
