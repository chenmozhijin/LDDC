name: Cross-Platform Validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.3

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows release
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build windows --release
      - name: Snapshot Windows production application
        id: production_e2e_artifact
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $source = 'lddc/build/windows/x64/runner/Release'
          $destination = 'lddc/build/production_e2e/windows'
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          Copy-Item -LiteralPath $source -Destination $destination -Recurse
          if (-not (Test-Path -LiteralPath "$destination/lddc.exe" -PathType Leaf)) {
            throw 'Windows production snapshot is incomplete'
          }
      # 发行包只打包"刚刚通过 Release 构建"的同一份产物，确保可运行性证据与产物对应。
      - name: Package Windows release artifacts
        id: release_package
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $out = 'build/release-artifacts/windows'
          python lddc/tool/package_release_artifacts.py windows-portable `
            --release-dir lddc/build/windows/x64/runner/Release --out $out
          python lddc/tool/package_release_artifacts.py build-info `
            --platform windows-amd64 --out $out
      # onefile 是 best-effort（见 docs/core/33）：7-Zip 安装器 SFX 是否可用由本步实测，
      # 失败只记录缺口，不阻断 required 门禁，也不静默删除该类型。
      - name: Package Windows onefile (best-effort)
        id: release_onefile
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $sfx = 'C:\Program Files\7-Zip\7zSD.sfx'
          if (-not (Test-Path -LiteralPath $sfx)) {
            throw "runner 镜像没有 7-Zip 安装器 SFX 模块：$sfx"
          }
          python lddc/tool/package_release_artifacts.py windows-onefile `
            --release-dir lddc/build/windows/x64/runner/Release `
            --sfx $sfx --out build/release-artifacts/windows
      - name: Verify Windows release artifacts
        id: release_verify
        if: always() && steps.release_package.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/release-artifacts/windows/LDDC-*-windows-amd64.zip |
            Select-Object -First 1
          if (-not $zip) { throw '没有找到 Windows 便携 zip' }
          $dest = Join-Path $env:RUNNER_TEMP 'lddc-portable-verify'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dest
          $exe = Join-Path $dest 'LDDC\lddc.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "便携 zip 解压后缺少 LDDC\lddc.exe：$exe"
          }
          # LDDC 是单实例应用：宿主上若残留实例，新进程会立刻转发并正常退出，使
          # "存活 N 秒"的判定失效。这里先清掉残留实例，让烟测结论只反映本次产物。
          Get-Process -Name lddc -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "便携 zip 解压后的 lddc.exe 在 12 秒内退出，退出码 $($process.ExitCode)"
          }
          Write-Host "便携 zip 启动烟测通过：window=$($process.MainWindowTitle)"
          $process.CloseMainWindow() | Out-Null
          Start-Sleep -Seconds 3
          if (-not $process.HasExited) { $process.Kill() }
      - name: Upload Windows release artifacts
        if: always() && steps.release_package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: lddc/build/release-artifacts/windows/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows release build tree
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-windows-amd64
          path: lddc/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 7
      - name: Build Windows debug application for native automation
        id: debug_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build windows --debug
      - name: Run offline application flows
        id: offline
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile offline -Device windows -Platform windows
      - name: Run native channel flows
        id: native_channel
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile platform -Device windows -Platform windows
      - name: Run Windows file dialog automation
        id: system_ui
        if: always() && steps.debug_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_windows_platform_tests.ps1
      - name: Run real desktop process and service tests
        id: desktop_process
        continue-on-error: true
        shell: pwsh
        run: >-
          ./tool/test/run_desktop_process_e2e.ps1 -Platform windows
          -AppExe lddc/build/production_e2e/windows/lddc.exe
      - name: Run production media resource checks
        id: media_resource
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_platform_media_resource.ps1 -Platform windows -LoopCount 3
      - name: Summarize required Windows phases
        id: required_outcomes
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python tool/test/ci_phase_summary.py `
            --title 'Windows validation' `
            --phase 'release_build|Release build|${{ steps.release_build.outcome }}' `
            --phase 'production_e2e_artifact|Production snapshot|${{ steps.production_e2e_artifact.outcome }}' `
            --phase 'debug_build|Debug build|${{ steps.debug_build.outcome }}' `
            --phase 'offline|Offline application|${{ steps.offline.outcome }}' `
            --phase 'native_channel|Native channels|${{ steps.native_channel.outcome }}' `
            --phase 'system_ui|System file dialog|${{ steps.system_ui.outcome }}' `
            --phase 'desktop_process|Desktop process|${{ steps.desktop_process.outcome }}' `
            --phase 'media_resource|Media resources|${{ steps.media_resource.outcome }}'
      - name: Upload Windows diagnostics
        if: always() && steps.required_outcomes.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-diagnostics
          path: lddc/build/integration_reports/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required Windows result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.required_outcomes.outcome }}' -ne 'success') {
            throw 'Windows required validation failed; see the phase summary and diagnostics artifact'
          }

  macos-validation:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      LDDC_XCODE_VERSION: '26.6'
    steps:
      - uses: actions/checkout@v7
      - name: 选择并验证固定 Xcode
        run: |
          developer_dir="/Applications/Xcode_${LDDC_XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "固定 Xcode 不存在: $developer_dir" >&2
            exit 1
          fi
          sudo xcode-select --switch "$developer_dir"
          xcode_version_output="$(xcodebuild -version)"
          actual_xcode="$(awk '/^Xcode / { print $2 }' <<<"$xcode_version_output")"
          actual_build_version="$(awk '/^Build version / { print $3 }' <<<"$xcode_version_output")"
          if [[ -z "$actual_xcode" || -z "$actual_build_version" ]]; then
            echo "无法解析 Xcode 版本信息: $xcode_version_output" >&2
            exit 1
          fi
          if [[ "$actual_xcode" != "$LDDC_XCODE_VERSION" ]]; then
            echo "Xcode 版本漂移: actual=$actual_xcode build=$actual_build_version expected=$LDDC_XCODE_VERSION" >&2
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Keep Apple dependency resolution on CocoaPods
        run: flutter config --no-enable-swift-package-manager
      - name: Build macOS release
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build macos --release
      - name: Snapshot macOS production application
        id: production_e2e_artifact
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          destination='lddc/build/production_e2e/macos'
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -R 'lddc/build/macos/Build/Products/Release/LDDC.app' "$destination/LDDC.app"
          test -x "$destination/LDDC.app/Contents/MacOS/LDDC"
      - name: Package macOS release artifacts
        id: release_package
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          out='build/release-artifacts/macos'
          python lddc/tool/package_release_artifacts.py macos-dmg \
            --app lddc/build/macos/Build/Products/Release/LDDC.app --arch arm64 --out $out
          python lddc/tool/package_release_artifacts.py build-info \
            --platform macos-arm64 --out $out
      # 挂载 dmg 并从挂载点启动，证明用户实际拿到的这个包能跑；同时记录签名状态
      # （未签名是预期结果，与 Python 版一致，用户需绕过 Gatekeeper）。
      - name: Verify macOS release artifacts
        id: release_verify
        if: always() && steps.release_package.outcome == 'success'
        continue-on-error: true
        run: |
          dmg="$(ls build/release-artifacts/macos/LDDC-*-arm64.dmg | head -n 1)"
          test -n "$dmg"
          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -quiet
          test -d "$mount_point/LDDC.app"
          codesign -dv "$mount_point/LDDC.app" 2>&1 || true
          "$mount_point/LDDC.app/Contents/MacOS/LDDC" &
          app_pid=$!
          sleep 12
          if ! kill -0 "$app_pid" 2>/dev/null; then
            hdiutil detach "$mount_point" -quiet || true
            echo "dmg 内的 LDDC 在 12 秒内退出" >&2
            exit 1
          fi
          echo "dmg 启动烟测通过：pid=$app_pid"
          kill "$app_pid" 2>/dev/null || true
          sleep 2
          hdiutil detach "$mount_point" -quiet || true
          rmdir "$mount_point" 2>/dev/null || true
      - name: Upload macOS release artifacts
        if: always() && steps.release_package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: lddc/build/release-artifacts/macos/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload macOS release build tree
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-macos-arm64
          path: lddc/build/macos/Build/Products/Release/**
          if-no-files-found: error
          retention-days: 7
      - name: Build macOS debug application for native automation
        id: debug_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build macos --debug
      - name: Run macOS native unit tests
        id: native_unit
        if: always() && steps.debug_build.outcome == 'success'
        continue-on-error: true
        working-directory: lddc
        run: |
          host_arch="$(uname -m)"
          case "$host_arch" in
            arm64|x86_64) ;;
            *) echo "Unsupported macOS runner architecture: $host_arch" >&2; exit 1 ;;
          esac
          result_path='build/integration_reports/macos-native-unit/RunnerTests.xcresult'
          rm -rf "$result_path"
          mkdir -p "$(dirname "$result_path")"
          python ../tool/test/process_group_supervisor.py \
            --phase macos-native-unit \
            --timeout 600 \
            --grace 5 \
            --cwd "$PWD" \
            --status build/integration_reports/macos-native-unit/supervisor.json \
            --stdout build/integration_reports/macos-native-unit/xcodebuild.stdout.log \
            --stderr build/integration_reports/macos-native-unit/xcodebuild.stderr.log \
            -- xcodebuild test \
              -workspace macos/Runner.xcworkspace \
              -scheme Runner \
              -configuration Debug \
              -destination "platform=macOS,arch=$host_arch" \
              -parallel-testing-enabled NO \
              -resultBundlePath "$result_path"
      - name: Run offline application flows
        id: offline
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile offline -Device macos -Platform macos
      - name: Run native channel flows
        id: native_channel
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile platform -Device macos -Platform macos
      - name: Run real desktop process and service tests
        id: desktop_process
        continue-on-error: true
        shell: pwsh
        run: >-
          ./tool/test/run_desktop_process_e2e.ps1 -Platform macos
          -AppExe lddc/build/production_e2e/macos/LDDC.app/Contents/MacOS/LDDC
      - name: Run production media resource checks
        id: media_resource
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_platform_media_resource.ps1 -Platform macos -LoopCount 3
      - name: Summarize required macOS phases
        id: required_outcomes
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python tool/test/ci_phase_summary.py `
            --title 'macOS validation' `
            --phase 'release_build|Release build|${{ steps.release_build.outcome }}' `
            --phase 'production_e2e_artifact|Production snapshot|${{ steps.production_e2e_artifact.outcome }}' `
            --phase 'debug_build|Debug build|${{ steps.debug_build.outcome }}' `
            --phase 'native_unit|Native unit tests|${{ steps.native_unit.outcome }}' `
            --phase 'offline|Offline application|${{ steps.offline.outcome }}' `
            --phase 'native_channel|Native channels|${{ steps.native_channel.outcome }}' `
            --phase 'desktop_process|Desktop process|${{ steps.desktop_process.outcome }}' `
            --phase 'media_resource|Media resources|${{ steps.media_resource.outcome }}'
      - name: Upload macOS diagnostics
        if: always() && steps.required_outcomes.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: macos-validation-diagnostics
          path: lddc/build/integration_reports/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required macOS result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.required_outcomes.outcome }}' -ne 'success') {
            throw 'macOS required validation failed; see the phase summary and diagnostics artifact'
          }

  macos-system-ui-validation:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      LDDC_XCODE_VERSION: '26.6'
    steps:
      - uses: actions/checkout@v7
      - name: 选择并验证固定 Xcode
        run: |
          developer_dir="/Applications/Xcode_${LDDC_XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "固定 Xcode 不存在: $developer_dir" >&2
            exit 1
          fi
          sudo xcode-select --switch "$developer_dir"
          xcode_version_output="$(xcodebuild -version)"
          actual_xcode="$(awk '/^Xcode / { print $2 }' <<<"$xcode_version_output")"
          actual_build_version="$(awk '/^Build version / { print $3 }' <<<"$xcode_version_output")"
          if [[ -z "$actual_xcode" || -z "$actual_build_version" ]]; then
            echo "无法解析 Xcode 版本信息: $xcode_version_output" >&2
            exit 1
          fi
          if [[ "$actual_xcode" != "$LDDC_XCODE_VERSION" ]]; then
            echo "Xcode 版本漂移: actual=$actual_xcode build=$actual_build_version expected=$LDDC_XCODE_VERSION" >&2
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Keep Apple dependency resolution on CocoaPods
        run: flutter config --no-enable-swift-package-manager
      - name: Run required macOS file panel cancellation
        id: panel_cancel_required
        continue-on-error: true
        shell: pwsh
        run: |
          python tool/test/process_group_supervisor.py `
            --phase macos-system-ui-required-workflow `
            --timeout 900 `
            --grace 5 `
            --cwd $PWD.Path `
            --status lddc/build/integration_reports/macos-native/required-panel/workflow-watchdog.json `
            -- pwsh -NoLogo -NoProfile -File ./tool/test/run_macos_platform_tests.ps1 `
              -Scenarios macos_open_panel_cancel `
              -ReportDir build/integration_reports/macos-native/required-panel
          exit $LASTEXITCODE
      - name: Finalize required macOS file panel reports
        id: required_report_finalize
        if: always()
        continue-on-error: true
        run: >-
          python tool/test/finalize_macos_system_ui_reports.py
          --report-root lddc/build/integration_reports/macos-native/required-panel
          --scenarios macos_open_panel_cancel
          --step-outcome '${{ steps.panel_cancel_required.outcome }}'
      - name: Run macOS Finder selection observation
        id: finder_observation
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python tool/test/process_group_supervisor.py `
            --phase macos-system-ui-observation-workflow `
            --timeout 900 `
            --grace 5 `
            --cwd $PWD.Path `
            --status lddc/build/integration_reports/macos-native/finder-observation/workflow-watchdog.json `
            -- pwsh -NoLogo -NoProfile -File ./tool/test/run_macos_platform_tests.ps1 `
              -Scenarios macos_open_panel_select `
              -ObservationScenarios macos_open_panel_select `
              -ReportDir build/integration_reports/macos-native/finder-observation
          exit $LASTEXITCODE
      - name: Finalize macOS Finder observation reports
        id: finder_observation_finalize
        if: always()
        continue-on-error: true
        run: >-
          python tool/test/finalize_macos_system_ui_reports.py
          --report-root lddc/build/integration_reports/macos-native/finder-observation
          --scenarios macos_open_panel_select
          --observation
          --step-outcome '${{ steps.finder_observation.outcome }}'
      - name: Summarize required macOS system UI phase
        id: required_outcomes
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python tool/test/ci_phase_summary.py `
            --title 'macOS system UI validation' `
            --phase 'panel_cancel_required|NSOpenPanel cancellation|${{ steps.panel_cancel_required.outcome }}' `
            --phase 'required_report_finalize|Required report finalization|${{ steps.required_report_finalize.outcome }}'
      - name: Upload macOS system UI diagnostics
        if: always() && steps.required_outcomes.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: macos-system-ui-diagnostics
          path: lddc/build/integration_reports/macos-native/required-panel/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload macOS Finder observation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-finder-observation-diagnostics
          path: lddc/build/integration_reports/macos-native/finder-observation/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required macOS system UI result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.required_outcomes.outcome }}' -ne 'success') {
            throw 'macOS system UI validation failed; see diagnostics artifact'
          }

  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build and automation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev dbus-x11 \
            xvfb xauth ffmpeg
      - run: flutter pub get
      - name: Build Linux release
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build linux --release
      - name: Package Linux release artifacts
        id: release_package
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          out='build/release-artifacts/linux'
          python lddc/tool/package_release_artifacts.py linux-deb \
            --bundle-dir lddc/build/linux/x64/release/bundle --arch amd64 --out $out
          python lddc/tool/package_release_artifacts.py build-info \
            --platform linux-amd64 --out $out
      # 在同一 job 内真实安装 deb、检查动态库无缺失、并在 xvfb 下有界启动安装后的
      # LDDC 命令，最后卸载——证明"可安装可运行"而不只是产出了文件。
      - name: Verify Linux release artifacts
        id: release_verify
        if: always() && steps.release_package.outcome == 'success'
        continue-on-error: true
        run: |
          deb="$(ls build/release-artifacts/linux/LDDC_*_amd64.deb | head -n 1)"
          test -n "$deb"
          sudo apt-get install -y "./$deb"
          dpkg -s LDDC >/dev/null
          test -x /usr/lib/LDDC/lddc
          test -L /usr/bin/LDDC
          if ldd /usr/lib/LDDC/lddc | grep -q 'not found'; then
            echo "deb 安装后的可执行文件存在缺失动态库：" >&2
            ldd /usr/lib/LDDC/lddc >&2
            exit 1
          fi
          xvfb-run -a --server-args="-screen 0 1280x720x24" /usr/bin/LDDC &
          app_pid=$!
          sleep 15
          if ! kill -0 "$app_pid" 2>/dev/null; then
            echo "deb 安装后的 LDDC 在 15 秒内退出" >&2
            exit 1
          fi
          echo "deb 安装与启动烟测通过：pid=$app_pid"
          kill "$app_pid" 2>/dev/null || true
          sleep 2
          sudo apt-get remove -y LDDC
          test ! -e /usr/lib/LDDC/lddc
      - name: Upload Linux release artifacts
        if: always() && steps.release_package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-amd64
          path: lddc/build/release-artifacts/linux/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload Linux release build tree
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-linux-amd64
          path: lddc/build/linux/x64/release/bundle/**
          if-no-files-found: error
          retention-days: 7
      - name: Build Linux debug application for native automation
        id: debug_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build linux --debug
      - name: Run offline application flows
        id: offline
        continue-on-error: true
        run: >-
          xvfb-run -a --server-args="-screen 0 1600x1000x24"
          pwsh -NoProfile -File tool/test/run_real_integration.ps1
          -Profile offline -Device linux -Platform linux
      - name: Run native channel flows
        id: native_channel
        continue-on-error: true
        run: >-
          xvfb-run -a --server-args="-screen 0 1600x1000x24"
          pwsh -NoProfile -File tool/test/run_real_integration.ps1
          -Profile platform -Device linux -Platform linux
      # Flutter Linux 当前不会把 Semantics identifier 暴露到 AT-SPI 子树。
      # Dogtail 脚本继续保留供人工环境验证；hosted CI 不使用坐标回退，
      # 也不把无法发现 Flutter 控件的场景伪装成自动化覆盖。
      # desktop_multi_window 0.3.0 与上游未发布 0.3.1 的 Linux teardown
      # 仍会错误移除 implicit FlView；上游 #448/#488 尚未修复。当前不维护
      # 第三方 fork，也不能用忽略退出码或保留 child engine 伪造资源回收证据。
      - name: Record Linux multi-window known issue
        if: always()
        run: |
          {
            echo '### Linux multi-window coverage'
            echo '- Release/Debug, offline flows, native channels and media resources remain required'
            echo '- Real desktop_multi_window child teardown: known upstream issue MixinNetwork/flutter-plugins#448/#488'
            echo '- No fork is maintained; multi-window runtime remains a manual known issue and is not reported as passed'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run production media resource checks
        id: media_resource
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_platform_media_resource.ps1 -Platform linux -LoopCount 3
      - name: Summarize required Linux phases
        id: required_outcomes
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python tool/test/ci_phase_summary.py `
            --title 'Linux validation' `
            --phase 'release_build|Release build|${{ steps.release_build.outcome }}' `
            --phase 'debug_build|Debug build|${{ steps.debug_build.outcome }}' `
            --phase 'offline|Offline application|${{ steps.offline.outcome }}' `
            --phase 'native_channel|Native channels|${{ steps.native_channel.outcome }}' `
            --phase 'media_resource|Media resources|${{ steps.media_resource.outcome }}'
      - name: Upload Linux diagnostics
        if: always() && steps.required_outcomes.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: linux-validation-diagnostics
          path: lddc/build/integration_reports/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required Linux result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.required_outcomes.outcome }}' -ne 'success') {
            throw 'Linux required validation failed; see the phase summary and diagnostics artifact'
          }

  android-validation:
    runs-on: ubuntu-latest
    # 四个验证阶段的独立硬超时合计 125 分钟，前面还包含 Release 构建、
    # 模拟器启动和失败报告回收。job 总上限必须覆盖这些固定开销，否则
    # GitHub 会在 always() 诊断步骤前直接终止，反而丢失真正的失败证据。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - run: flutter pub get
      # 发行包需要"可安装"，而 CI 没有也不应该持有正式发布密钥：这里用 keytool 生成
      # 一次性 keystore（写在 RUNNER_TEMP，绝不进入仓库工作树——.keystore 是 hygiene
      # 禁用后缀），经 GITHUB_ENV 注入 gradle 的 ciArtifact 签名配置。
      # 每次运行的签名都不同，因此产物只能用于安装验证，不能当作发布版。
      - name: Generate CI-only artifact keystore
        id: ci_keystore
        run: |
          keystore="$RUNNER_TEMP/lddc-ci-artifact.jks"
          store_password="$(openssl rand -hex 16)"
          key_password="$(openssl rand -hex 16)"
          keytool -genkeypair -v \
            -keystore "$keystore" \
            -storetype JKS \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias lddc-ci-artifact \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=LDDC CI artifact, OU=CI, O=chenmozhijin, C=CN"
          {
            echo "LDDC_CI_ARTIFACT_KEYSTORE=$keystore"
            echo "LDDC_CI_ARTIFACT_STORE_PASSWORD=$store_password"
            echo "LDDC_CI_ARTIFACT_KEY_ALIAS=lddc-ci-artifact"
            echo "LDDC_CI_ARTIFACT_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"
      - name: Build signed Android release outputs
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Package Android release artifacts
        id: release_package
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          out='build/release-artifacts/android'
          python lddc/tool/package_release_artifacts.py android \
            --apk lddc/build/app/outputs/flutter-apk/app-release.apk \
            --aab lddc/build/app/outputs/bundle/release/app-release.aab \
            --out $out
          python lddc/tool/package_release_artifacts.py build-info \
            --platform android --out $out
      # 验签是核心：没有签名的 APK 装不上，之前"无签名打包"会把这个问题一路掩盖到
      # 用户下载后才发现。
      - name: Verify Android signatures
        id: release_verify
        if: always() && steps.release_package.outcome == 'success'
        continue-on-error: true
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          apk="$(ls build/release-artifacts/android/LDDC-*-android.apk | head -n 1)"
          aab="$(ls build/release-artifacts/android/LDDC-*-android.aab | head -n 1)"
          test -n "$apk" && test -n "$aab"
          "$apksigner" verify --print-certs "$apk"
          # AAB 用 JAR 签名，jarsigner 是 JDK 自带工具。
          jarsigner -verify "$aab"
      - name: Upload Android release artifacts
        if: always() && steps.release_package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: lddc/build/release-artifacts/android/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android release build tree
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-android
          path: |
            lddc/build/app/outputs/flutter-apk/**
            lddc/build/app/outputs/bundle/**
          if-no-files-found: error
          retention-days: 7
      - name: Enable KVM access for the Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Run Android application, channel, and DocumentsUI validation
        id: platform_validation
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tool/test/run_android_ci_validation.sh
      - name: Summarize required Android phases
        id: required_outcomes
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python tool/test/ci_phase_summary.py `
            --title 'Android validation' `
            --phase 'release_build|Release APK and AAB|${{ steps.release_build.outcome }}' `
            --phase 'platform_validation|Application and DocumentsUI|${{ steps.platform_validation.outcome }}'
      - name: Upload Android diagnostics
        if: always() && steps.required_outcomes.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-diagnostics
          path: |
            lddc/build/integration_reports/**
            lddc/build/app/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required Android result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.required_outcomes.outcome }}' -ne 'success') {
            throw 'Android required validation failed; see the phase summary and diagnostics artifact'
          }

  ios-validation:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      LDDC_XCODE_VERSION: '26.6'
      LDDC_IOS_RUNTIME_VERSION: '26.5'
    steps:
      - uses: actions/checkout@v7
      - name: 选择并验证固定 Xcode for iOS 26 automation
        run: |
          developer_dir="/Applications/Xcode_${LDDC_XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "Pinned Xcode is unavailable: $developer_dir" >&2
            exit 1
          fi
          sudo xcode-select --switch "$developer_dir"
          xcode_version_output="$(xcodebuild -version)"
          actual_xcode="$(awk '/^Xcode / { print $2 }' <<<"$xcode_version_output")"
          actual_build_version="$(awk '/^Build version / { print $3 }' <<<"$xcode_version_output")"
          if [[ -z "$actual_xcode" || -z "$actual_build_version" ]]; then
            echo "无法解析 Xcode 版本信息: $xcode_version_output" >&2
            exit 1
          fi
          if [[ "$actual_xcode" != "$LDDC_XCODE_VERSION" ]]; then
            echo "Xcode 版本漂移: actual=$actual_xcode build=$actual_build_version expected=$LDDC_XCODE_VERSION" >&2
            exit 1
          fi
          # 在下载 Flutter 依赖前确认精确 runtime，避免镜像缺少工具链时浪费完整构建时间。
          if ! xcrun simctl list runtimes available -j | jq -e \
            --arg version "$LDDC_IOS_RUNTIME_VERSION" \
            '[.runtimes[] | select(.isAvailable == true and .platform == "iOS" and .version == $version)] | length > 0' \
            >/dev/null; then
            echo "可用 iOS Simulator runtime 不包含 $LDDC_IOS_RUNTIME_VERSION" >&2
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Keep Apple dependency resolution on CocoaPods
        run: flutter config --no-enable-swift-package-manager
      - name: Create and boot a compatible iOS simulator
        id: simulator
        continue-on-error: true
        run: bash tool/test/create_ios_simulator.sh
      - name: Run required iOS Document Picker cancellation
        id: picker_cancel_required
        if: always() && steps.simulator.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $cancelScenarios = @(
            'ios_document_picker_cancel_1'
            'ios_document_picker_cancel_2'
            'ios_document_picker_cancel_3'
          )
          # 三个取消 round 是 required；每轮独立 XCTest，避免单方法累计触发 120 秒限制。
          ./tool/test/run_ios_platform_tests.ps1 `
            -Device $env:DEVICE_ID `
            -Scenarios $cancelScenarios `
            -ReportDir build/integration_reports/ios-native/required-picker
      - name: Run iOS Files selection and export observation
        id: files_observation
        if: always() && steps.simulator.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $filesObservationScenarios = @(
            'ios_document_picker_select'
            'ios_document_picker_export'
            'ios_document_picker_export_cancel'
            'ios_document_picker_export_termination'
          )
          # Files 场景仍执行真实 XCTest、证据和资源清理；失败仅作为 observation 保留。
          ./tool/test/run_ios_platform_tests.ps1 `
            -Device $env:DEVICE_ID `
            -Scenarios $filesObservationScenarios `
            -ObservationScenarios $filesObservationScenarios `
            -ReportDir build/integration_reports/ios-native/files-observation
      - name: Build iOS release without codesigning
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build ios --release --no-codesign
      - name: Package iOS release artifacts
        id: release_package
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          out='build/release-artifacts/ios'
          python lddc/tool/package_release_artifacts.py ios \
            --app lddc/build/ios/iphoneos/Runner.app --out $out
          python lddc/tool/package_release_artifacts.py build-info \
            --platform ios-arm64 --out $out
      # 无证书时只能给未签名产物：这里如实记录"架构正确但不可安装"，
      # 不把它伪装成可安装包。
      - name: Verify iOS release artifacts
        id: release_verify
        if: always() && steps.release_package.outcome == 'success'
        continue-on-error: true
        run: |
          app='lddc/build/ios/iphoneos/Runner.app'
          test -d "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -n "$executable"
          file "$app/$executable"
          file "$app/$executable" | grep -q 'arm64' || {
            echo "iOS 产物不是 arm64 设备构建" >&2
            exit 1
          }
          if codesign -dv "$app" 2>&1 | grep -q 'Authority='; then
            echo "iOS 产物意外带正式签名，请检查构建参数" >&2
            exit 1
          fi
          echo "iOS 产物为未签名 arm64 设备构建（不可安装，仅归档）"
      - name: Upload iOS release artifacts
        if: always() && steps.release_package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: lddc/build/release-artifacts/ios/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload iOS release build tree
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-ios
          path: lddc/build/ios/iphoneos/**
          if-no-files-found: error
          retention-days: 7
      - name: Run offline application flows
        id: offline
        if: always() && steps.simulator.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        # iOS hosted runner 首个 integration target 需要完成原生编译、安装和 VM
        # 调试连接；此前 300 秒只终止在隐藏 loading 用例，业务场景尚未开始。
        # 这里只扩大 testStart 前的基础设施窗口，场景步骤仍使用原有严格超时。
        run: ./tool/test/run_real_integration.ps1 -Profile offline -Device $env:DEVICE_ID -Platform ios -StartupTimeoutSeconds 600
      - name: Run native channel flows
        id: native_channel
        if: always() && steps.simulator.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tool/test/run_real_integration.ps1 -Profile platform -Device $env:DEVICE_ID -Platform ios
      - name: Restore iOS debug application after Flutter integration
        id: debug_rebuild
        if: always() && steps.simulator.outcome == 'success'
        continue-on-error: true
        working-directory: lddc
        # flutter test 会把 Generated.xcconfig 暂时指向 test listener；测试结束后
        # 临时 listener 会被删除。原生测试前重建默认 main.dart，避免 Xcode
        # 继续引用已不存在的临时入口。
        run: |
          mkdir -p build/integration_reports/ios-debug-rebuild
          python ../tool/test/process_group_supervisor.py \
            --phase ios-debug-rebuild \
            --timeout 900 \
            --grace 5 \
            --cwd "$PWD" \
            --status build/integration_reports/ios-debug-rebuild/supervisor.json \
            --stdout build/integration_reports/ios-debug-rebuild/flutter.stdout.log \
            --stderr build/integration_reports/ios-debug-rebuild/flutter.stderr.log \
            -- flutter build ios --debug --simulator
      - name: Run iOS native unit tests
        id: native_tests
        if: always() && steps.debug_rebuild.outcome == 'success'
        continue-on-error: true
        working-directory: lddc
        run: |
          # Flutter integration 可能关闭 Simulator。只对 Shutdown 设备执行
          # boot，已在 Booting/Booted 的设备直接等待；其他状态不得吞掉。
          state="$(xcrun simctl list devices --json | jq -r --arg udid "$DEVICE_ID" '
            [.devices[][] | select(.udid == $udid)] | first | .state // empty
          ')"
          case "$state" in
            Shutdown) xcrun simctl boot "$DEVICE_ID" ;;
            Booting|Booted) ;;
            *) echo "Unsupported or missing simulator state: ${state:-missing}" >&2; exit 1 ;;
          esac
          xcrun simctl bootstatus "$DEVICE_ID" -b
          result_path='build/integration_reports/ios-native-unit/RunnerTests.xcresult'
          rm -rf "$result_path"
          mkdir -p "$(dirname "$result_path")"
          python ../tool/test/process_group_supervisor.py \
            --phase ios-native-unit \
            --timeout 600 \
            --grace 5 \
            --cwd "$PWD" \
            --status build/integration_reports/ios-native-unit/supervisor.json \
            --stdout build/integration_reports/ios-native-unit/xcodebuild.stdout.log \
            --stderr build/integration_reports/ios-native-unit/xcodebuild.stderr.log \
            -- xcodebuild test \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -destination "platform=iOS Simulator,id=$DEVICE_ID,arch=$IOS_HOST_ARCH" \
              -parallel-testing-enabled NO \
              -resultBundlePath "$result_path" \
              CODE_SIGNING_ALLOWED=NO
      - name: Delete the CI iOS simulator
        id: simulator_cleanup
        if: always() && env.DEVICE_ID != ''
        continue-on-error: true
        run: |
          # 已关机设备会让 shutdown 返回非零，但不代表泄漏；delete 必须成功。
          xcrun simctl shutdown "$DEVICE_ID" || true
          xcrun simctl delete "$DEVICE_ID"
      - name: Summarize required iOS phases
        id: required_outcomes
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python tool/test/ci_phase_summary.py `
            --title 'iOS validation' `
            --phase 'simulator|Simulator lifecycle|${{ steps.simulator.outcome }}' `
            --phase 'release_build|Release build|${{ steps.release_build.outcome }}' `
            --phase 'offline|Offline application|${{ steps.offline.outcome }}' `
            --phase 'native_channel|Native channels|${{ steps.native_channel.outcome }}' `
            --phase 'debug_rebuild|Debug application|${{ steps.debug_rebuild.outcome }}' `
            --phase 'native_tests|Native XCTest|${{ steps.native_tests.outcome }}' `
            --phase 'picker_cancel_required|Document Picker cancellation XCUITest|${{ steps.picker_cancel_required.outcome }}' `
            --phase 'simulator_cleanup|Simulator cleanup|${{ steps.simulator_cleanup.outcome }}'
      - name: Upload iOS diagnostics
        if: always() && steps.required_outcomes.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ios-validation-diagnostics
          path: lddc/build/integration_reports/ios-native/required-picker/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload iOS Files observation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-files-observation-diagnostics
          path: lddc/build/integration_reports/ios-native/files-observation/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce required iOS result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.required_outcomes.outcome }}' -ne 'success') {
            throw 'iOS required validation failed; see the phase summary and diagnostics artifact'
          }

  experimental-web:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build experimental Web client
        id: release_build
        working-directory: lddc
        run: flutter build web --release
      - name: Package Web release artifacts
        id: release_package
        continue-on-error: true
        run: |
          out='build/release-artifacts/web'
          python lddc/tool/package_release_artifacts.py web \
            --web-dir lddc/build/web --out $out
          python lddc/tool/package_release_artifacts.py build-info \
            --platform web --out $out
      # Web 是新增类型（Python 版没有），用本地静态服务器确认入口真的可服务。
      - name: Verify Web release artifacts
        id: release_verify
        if: always() && steps.release_package.outcome == 'success'
        continue-on-error: true
        run: |
          web='lddc/build/web'
          test -f "$web/index.html"
          test -f "$web/main.dart.js"
          (cd "$web" && python -m http.server 8731 >/dev/null 2>&1 & echo $! > /tmp/web-server.pid)
          sleep 3
          for path in index.html main.dart.js flutter_service_worker.js; do
            status="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8731/$path")"
            test "$status" = '200' || {
              echo "Web 入口 $path 返回 $status" >&2
              exit 1
            }
          done
          echo "Web 静态托管检查通过"
          kill "$(cat /tmp/web-server.pid)" 2>/dev/null || true
      - name: Upload Web release artifacts
        if: always() && steps.release_package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: lddc/build/release-artifacts/web/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload Web release build tree
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-web
          path: lddc/build/web/**
          if-no-files-found: error
          retention-days: 7
      - name: Run browser capability observation
        working-directory: lddc
        run: |
          mkdir -p build/web-observation
          flutter test --platform chrome test/observation/web_capability_smoke_test.dart \
            --file-reporter=json:build/web-observation/tests.jsonl
          python ../tool/test/json_report_to_junit.py \
            --input build/web-observation/tests.jsonl \
            --output build/web-observation/tests.xml
      - name: Upload Web observation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experimental-web-observation
          path: lddc/build/web-observation/**
          if-no-files-found: warn
          retention-days: 7

  # 下面两个 job 只补齐发行包的架构覆盖（Python 版同时发布 mac x64/arm64 与
  # linux amd64/arm64），不重复上面的平台验证：它们不参与 required 门禁汇总，
  # 也不使用 ci_phase_summary.py 与 required_outcomes 条件。
  macos-release-amd64:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS x64 release
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build macos --release
      - name: Package macOS x64 release artifacts
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          out='build/release-artifacts/macos-amd64'
          python lddc/tool/package_release_artifacts.py macos-dmg \
            --app lddc/build/macos/Build/Products/Release/LDDC.app --arch amd64 --out $out
          python lddc/tool/package_release_artifacts.py build-info \
            --platform macos-amd64 --out $out
      - name: Verify macOS x64 release artifacts
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          dmg="$(ls build/release-artifacts/macos-amd64/LDDC-*-amd64.dmg | head -n 1)"
          test -n "$dmg"
          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -quiet
          test -d "$mount_point/LDDC.app"
          file "$mount_point/LDDC.app/Contents/MacOS/LDDC"
          hdiutil detach "$mount_point" -quiet || true
          rmdir "$mount_point" 2>/dev/null || true
      - name: Upload macOS x64 release artifacts
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-amd64
          path: lddc/build/release-artifacts/macos-amd64/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload macOS x64 release build tree
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-macos-amd64
          path: lddc/build/macos/Build/Products/Release/**
          if-no-files-found: error
          retention-days: 7

  linux-release-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libayatana-appindicator3-dev dbus-x11 xvfb xauth
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux arm64 release
        id: release_build
        continue-on-error: true
        working-directory: lddc
        run: flutter build linux --release
      - name: Package Linux arm64 release artifacts
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          out='build/release-artifacts/linux-arm64'
          python lddc/tool/package_release_artifacts.py linux-deb \
            --bundle-dir lddc/build/linux/arm64/release/bundle --arch arm64 --out $out
          python lddc/tool/package_release_artifacts.py build-info \
            --platform linux-arm64 --out $out
      - name: Verify Linux arm64 release artifacts
        if: always() && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          deb="$(ls build/release-artifacts/linux-arm64/LDDC_*_arm64.deb | head -n 1)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -q 'usr/lib/LDDC/lddc'
      - name: Upload Linux arm64 release artifacts
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-arm64
          path: lddc/build/release-artifacts/linux-arm64/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload Linux arm64 release build tree
        if: always() && steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-linux-arm64
          path: lddc/build/linux/arm64/release/bundle/**
          if-no-files-found: error
          retention-days: 7
