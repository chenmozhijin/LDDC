name: Lyrics Service Compatibility

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyrics-service-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0-0.2.pre

jobs:
  lyrics-service-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - run: flutter pub get
      - name: Run all cloud-source protocol probes
        working-directory: lddc
        env:
          RUN_LIVE_API: '1'
          LIVE_API_SOURCES: qm,ne,kg,lrclib
          LIVE_API_FAILURE_POLICY: continue
          LIVE_API_REPORT_PATH: build/live-api-sources.json
        run: |
          mkdir -p build/live-network
          flutter test test/live/api_real_request_smoke_test.dart \
            --file-reporter=json:build/live-network/tests.jsonl
          python ../tool/test/json_report_to_junit.py \
            --input build/live-network/tests.jsonl \
            --output build/live-network/tests.xml
      - name: Upload redacted live reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-network-reports
          path: |
            lddc/build/live-api-sources.json
            lddc/build/live-network/tests.jsonl
            lddc/build/live-network/tests.xml
          if-no-files-found: error
          retention-days: 7
