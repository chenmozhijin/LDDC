name: Performance and Resource Regression

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0-0.2.pre

jobs:
  algorithm-benchmarks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - run: flutter pub get
      - name: Run full algorithm and Ruby benchmarks
        working-directory: packages/lddc_lyrics_core
        env:
          LDDC_ALGORITHM_BENCHMARK: '1'
          LDDC_RUBY_BENCHMARK: '1'
        run: dart test --tags full-benchmark

  desktop-resource-stress:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - run: flutter pub get
      - name: Build resource-boundary runner
        working-directory: lddc
        run: >-
          flutter build windows --release
          -t integration_test/standalone/windows_multi_window_smoke_main.dart
      - name: Enforce resident window resource thresholds
        working-directory: lddc
        shell: pwsh
        run: |
          ./tool/run_windows_multi_window_smoke.ps1 `
            -SkipBuild `
            -Configuration Release `
            -Scenario resident `
            -Cycles 100 `
            -SettleSeconds 10 `
            -ReportPath build/windows_multi_window_smoke/report.json
      - name: Upload resource report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-resource-boundaries
          path: lddc/build/windows_multi_window_smoke/**
          if-no-files-found: error
          retention-days: 7

  media-resource-stress:
    name: Media resource 20 cycles (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true
      - name: Install Linux native asset dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config liblzma-dev
      - run: flutter pub get
      - name: Enforce production media resource cleanup
        shell: pwsh
        run: ./tool/test/run_platform_media_resource.ps1 -Platform ${{ matrix.platform }} -LoopCount 20
      - name: Upload media resource report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-media-resource-${{ matrix.platform }}
          path: lddc/build/integration_reports/platform-media-resource/**
          if-no-files-found: error
          retention-days: 7
